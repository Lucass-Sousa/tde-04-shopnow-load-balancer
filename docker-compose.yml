networks:
  shopnow-net:
    driver: bridge

services:

  balanceador:
    build: .
    container_name: shopnow-balancer
    command: ["python", "balanceador/app.py"]
    ports:
      - "3001:3001"
    networks:
      - shopnow-net
    depends_on:
      - server1
      - server2
      - server3

  server1:
    build: .
    container_name: shopnow-server1
    command: ["python", "instancias/app.py", "--id", "1", "--port", "3002"]
    ports:
      - "3002:3002"
    networks:
      - shopnow-net
    restart: unless-stopped

  server2:
    build: .
    container_name: shopnow-server2
    command: ["python", "instancias/app.py", "--id", "2", "--port", "3003"]
    ports:
      - "3003:3003"
    networks:
      - shopnow-net
    restart: unless-stopped

  server3:
    build: .
    container_name: shopnow-server3
    command: ["python", "instancias/app.py", "--id", "3", "--port", "3004"]
    ports:
      - "3004:3004"
    networks:
      - shopnow-net
    restart: unless-stopped
