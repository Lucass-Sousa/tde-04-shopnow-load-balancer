worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=10s;

    map $arg_algorithm $shopnow_upstream {
        default      shopnow_round_robin;
        round-robin  shopnow_round_robin;
        least-conn   shopnow_least_connections;
    }

    upstream shopnow_round_robin {
        zone shopnow_round_robin 64k;
        server server1:3002 resolve max_fails=1 fail_timeout=10s;
        server server2:3003 resolve max_fails=1 fail_timeout=10s;
        server server3:3004 resolve max_fails=1 fail_timeout=10s;
    }

    upstream shopnow_least_connections {
        zone shopnow_least_connections 64k;
        least_conn;
        server server1:3002 resolve max_fails=1 fail_timeout=10s;
        server server2:3003 resolve max_fails=1 fail_timeout=10s;
        server server3:3004 resolve max_fails=1 fail_timeout=10s;
    }

    server {
        listen 3001;

        location / {
            proxy_pass http://$shopnow_upstream;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
        }
    }
}
